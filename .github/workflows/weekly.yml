name: weekly-checks
on:
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - run: python3 scripts/check_links.py
      - name: Open issue if links broke
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "All links resolved" link_report.md; then
            gh issue create --title "Broken evidence links $(date +%F)" --body-file link_report.md
          fi
